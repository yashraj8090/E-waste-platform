              void markCashPaid(JSONObject order) {
                  String receiptNo="KS-CASH-"+new SimpleDateFormat("yyyyMMdd-HHmmss",Locale.US).format(new Date())+"-"+(int)(Math.random()*900+100);
                  String paidAt=isoNow();
                  new Thread(() -> { try {

                          19, fg, true));
                      line.addView(details,
                          new LinearLayout.LayoutParams(0, -2, 1));
                      panel.addView(line);

                      LinearLayout.LayoutParams p = lp(-1, -2);
                      p.setMargins(0, 0, 0, d(9));
                      body.addView(panel, p);
                  }
              }

              void lotsPage() {
                  heading(tr("My scrap lots", "मेरे स्क्रैप लॉट्स",
                      "माझे भंगार लॉट"));

                  Button add = button(tr("＋ Add lot", "＋ लॉट जोड़ें",
                      "＋ लॉट जोडा"));
                  add.setOnClickListener(v -> addLot());
                  body.addView(add, lp(-1, 48));

                  JSONArray lots;
                  try {
                      lots = new JSONArray(pref.getString("lots", "[]"));
                  } catch (Exception e) {
                      lots = new JSONArray();
                  }

                  if (lots.length() == 0) {
                      TextView empty = t(tr(
                          "No lots yet. Add one above.",
                          "अभी कोई लॉट नहीं है। ऊपर से जोड़ें।",
                          "अद्याप लॉट नाही. वरून जोडा."),
                          15, muted, false);
                      empty.setGravity(Gravity.CENTER);
                      body.addView(empty, lp(-1, 100));
                  }

                  for (int i = lots.length() - 1; i >= 0; i--) {
                      JSONObject item = lots.optJSONObject(i);
                      if (item == null) continue;

                      LinearLayout panel = panel();
                      panel.addView(t(item.optString("material"),
                          17, fg, true));
                      panel.addView(t("ID: " + item.optString("id"),
                          12, muted, false));
                      panel.addView(t(tr("Weight: ", "वजन: ", "वजन: ") +
                          item.optDouble("weight") + " kg", 14, fg, true));

                      if (!item.optString("location").isEmpty()) {
                          panel.addView(t(tr("Location: ", "स्थान: ",
                              "ठिकाण: ") + item.optString("location"),
                              13, fg, false));
                      }

                      panel.addView(t(tr("Status: Pending",
                          "स्थिति: लंबित", "स्थिती: प्रलंबित"),
                          13, fg, true));

                      LinearLayout.LayoutParams p = lp(-1, -2);
                      p.setMargins(0, d(10), 0, 0);
                      body.addView(panel, p);
                  }
              }

              void profile() {
                  heading(tr("App Settings", "ऐप सेटिंग्स",
                      "अॅप सेटिंग्ज"));

                  LinearLayout profile = panel();
                  profile.addView(t("कबाड़ी साथी / Kabadi Saathi",
                      20, fg, true));
                  profile.addView(t(tr("Language and appearance",
                      "भाषा और दिखावट", "भाषा आणि स्वरूप"),
                      14, muted, false));
                  body.addView(profile, lp(-1, -2));

                  Button languageButton = button(tr(
                      "Language: English / Hindi / Marathi",
                      "भाषा बदलें / हिंदी",
                      "भाषा बदला / मराठी"));
                  languageButton.setOnClickListener(v -> chooseLanguage());
                  LinearLayout.LayoutParams languageParams = lp(-1, 50);
                  languageParams.setMargins(0, d(9), 0, 0);
                  body.addView(languageButton, languageParams);

                  Button themeButton = button(tr(
                      night ? "Switch to day mode" : "Switch to night mode",
                      night ? "दिन मोड चालू करें" : "रात मोड चालू करें",
                      night ? "दिवस मोड सुरू करा" : "रात्र मोड सुरू करा"));
                  themeButton.setOnClickListener(v -> {
                      night = !night;
                      pref.edit().putBoolean("night_mode", night).apply();
                      render();
                  });
                  LinearLayout.LayoutParams themeParams = lp(-1, 50);
                  themeParams.setMargins(0, d(8), 0, 0);
                  body.addView(themeButton, themeParams);

                  heading(tr("Safety tips", "सुरक्षा सुझाव",
                      "सुरक्षा सूचना"));
                  body.addView(t(tr(
                      "• Do not cut or burn batteries.\n" +
                      "• Keep e-waste separated.\n" +
                      "• Wear gloves and wash your hands.",
                      "• बैटरी को काटें या जलाएँ नहीं।\n" +
                      "• ई-कचरे को अलग रखें।\n" +
                      "• दस्ताने पहनें और हाथ धोएँ।",
                      "• बॅटरी कापू किंवा जाळू नका.\n" +
                      "• ई-कचरा वेगळा ठेवा.\n" +
                      "• हातमोजे घाला आणि हात धुवा."),
                      14, muted, false), lp(-1, -2));

                  gap(12);
                  body.addView(t(tr(
                      "Prices and earnings are demo data. AI recognition, " +
                      "live prices, payments and recycler verification " +
                      "are not connected.",
                      "भाव और कमाई डेमो डेटा हैं। AI पहचान, लाइव भाव, " +
                      "भुगतान और रीसाइक्लर सत्यापन अभी जुड़े नहीं हैं।",
                      "दर आणि कमाई डेमो डेटा आहेत. AI ओळख, थेट दर, " +
                      "पेमेंट आणि रीसायकलर पडताळणी जोडलेली नाही."),
                      12, muted, false), lp(-1, -2));
              }

              void chooseLanguage() {
                  String[] choices = {
                      "हिंदी (Hindi)",
                      "मराठी (Marathi)",
                      "English"
                  };

                  int selected = "hi".equals(language) ? 0 :
                      "mr".equals(language) ? 1 : 2;

                  new AlertDialog.Builder(this)
                      .setTitle(tr("Choose app language",
                          "ऐप की भाषा चुनें", "अॅपची भाषा निवडा"))
                      .setSingleChoiceItems(choices, selected,
                          (dialog, which) -> {
                              language = which == 0 ? "hi" :
                                  which == 1 ? "mr" : "en";
                              pref.edit().putString("language", language)
                                  .apply();
                              dialog.dismiss();
                              render();
                          })
                      .setNegativeButton(tr("Cancel", "रद्द करें",
                          "रद्द करा"), null)
                      .show();
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EcoCycle-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

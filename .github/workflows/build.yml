             private void uploadLotToSupabase(JSONObject item) {
             new Thread(() -> {
             HttpURLConnection connection = null;

                try {
                URL url = new URL(
                SUPABASE_URL + "/rest/v1/scrap_lots"
             );

            connection = (HttpURLConnection) url.openConnection();
            connection.setRequestMethod("POST");
            connection.setConnectTimeout(15000);
            connection.setReadTimeout(15000);
            connection.setDoOutput(true);

            connection.setRequestProperty(
                "apikey", SUPABASE_KEY
            );
            connection.setRequestProperty(
                "Authorization", "Bearer " + SUPABASE_KEY
            );
            connection.setRequestProperty(
                "Content-Type", "application/json"
            );
            connection.setRequestProperty(
                "Prefer", "return=minimal"
            );

            JSONObject record = new JSONObject();
            record.put("id", item.getString("id"));
            record.put("material", item.getString("material"));
            record.put("weight", item.getDouble("weight"));
            record.put("location", item.optString("location", ""));
            record.put("status", "Pending");

            byte[] payload = record.toString().getBytes(
                StandardCharsets.UTF_8
            );

            try (OutputStream out = connection.getOutputStream()) {
                out.write(payload);
            }

            int code = connection.getResponseCode();
            java.io.InputStream stream =
            (code >= 200 && code < 400)
            ? connection.getInputStream()
           : connection.getErrorStream();

           java.io.ByteArrayOutputStream buffer =
           new java.io.ByteArrayOutputStream();

           if (stream != null) {
           byte[] bytes = new byte[1024];
           int count;

           while ((count = stream.read(bytes)) != -1) {
            buffer.write(bytes, 0, count);
           }
          stream.close();
           }

          String serverMessage = buffer.toString("UTF-8");

           android.util.Log.e(
           "SUPABASE_UPLOAD",
            "HTTP " + code + ": " + serverMessage
           );

            runOnUiThread(() -> {
                if (code >= 200 && code < 300) {
                    toast("Lot saved online successfully");
                } else {
                    toast("Online save failed. HTTP " + code);
                }
            });

            } catch (Exception e) {
            runOnUiThread(() ->
                toast("Online sync failed. Check internet and settings.")
            );
            } finally {
            if (connection != null) {
                connection.disconnect();
             }
            }
           }).start();
            }



              }
          
              void showReceipt(JSONObject o) {
                  String paidAt=o.optString("paid_at",isoNow());
                  String formatted=paidAt;
                  try {
                      Date parsed = null;
                      String[] patterns = {"yyyy-MM-dd'T'HH:mm:ss.SSSXXX", "yyyy-MM-dd'T'HH:mm:ssXXX", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"};
                      for (String pattern : patterns) { try { SimpleDateFormat parser=new SimpleDateFormat(pattern,Locale.US); parser.setTimeZone(java.util.TimeZone.getTimeZone("UTC")); parsed=parser.parse(paidAt); if(parsed!=null) break; } catch(Exception ignored) {} }
                      if(parsed!=null) formatted=new SimpleDateFormat("dd MMM yyyy, hh:mm a",Locale.getDefault()).format(parsed);
                  } catch(Exception ignored){}
                  String receipt="KABADI SAATHI — CASH PAYMENT RECEIPT\n\nReceipt No: "+o.optString("receipt_number","Not available")+
                      "\nOrder ID: "+o.optString("id")+"\n\nCollector: "+o.optString("collector_name","—")+
                      "\nCollector ID: "+o.optString("collector_id","—")+"\nRecycler: "+o.optString("recycler_name","—")+
                      "\nRecycler ID: "+o.optString("recycler_id","—")+"\n\nMaterial: "+o.optString("material","—")+
                      "\nWeight: "+o.optDouble("weight",0)+" kg\nCash amount: ₹"+money(o.optDouble("amount",0))+
                      "\nPayment status: CASH PAID\nDate & time: "+formatted+

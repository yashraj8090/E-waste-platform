              void saveReceiptLocal(JSONObject order) {
                  try { JSONArray rs=new JSONArray(pref.getString("receipts","[]")); String id=order.optString("receipt_number"); boolean exists=false;
                      for(int i=0;i<rs.length();i++){JSONObject r=rs.optJSONObject(i);if(r!=null&&r.optString("receipt_number").equals(id))exists=true;}
                      if(!exists)rs.put(order);pref.edit().putString("receipts",rs.toString()).apply();

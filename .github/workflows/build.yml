                          else {intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);intent.addCategory(Intent.CATEGORY_OPENABLE);intent.setType("image/*");startActivityForResult(intent,PHOTO_REQUEST+1);} }
                      catch(Exception e){toast("Unable to open camera or gallery.");}
                  }).setNegativeButton("Cancel",null).show();
              }
          
              @Override protected void onActivityResult(int requestCode,int resultCode,Intent data) {
                  super.onActivityResult(requestCode,resultCode,data);if(resultCode!=RESULT_OK||data==null)return;
                  if(requestCode==PHOTO_REQUEST+1 && data.getData()!=null){selectedPhoto=data.getData();
                      try { getContentResolver().takePersistableUriPermission(selectedPhoto, data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION)); } catch(Exception ignored) {}
                      toast("Photo selected.");}
                  else if(requestCode==PHOTO_REQUEST && data.getExtras()!=null){Object obj=data.getExtras().get("data");if(obj instanceof Bitmap){
                      try { File f=new File(getCacheDir(),"lot-photo-"+System.currentTimeMillis()+".jpg"); FileOutputStream out=new FileOutputStream(f); ((Bitmap)obj).compress(Bitmap.CompressFormat.JPEG,85,out); out.flush(); out.close(); selectedPhoto=Uri.fromFile(f); toast("Photo captured."); }
                      catch(Exception e){toast("Photo captured but could not be saved.");}
                  }}
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kabadi-Saathi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
                          

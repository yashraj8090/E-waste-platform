              void authenticate(boolean register, String chosenRole, String name, String mail, String password) {
                  if (mail.isEmpty() || !mail.contains("@") || password.length() < 6 || (register && name.isEmpty())) {
                      toast("Enter a valid email, password (6+ characters)" + (register ? " and name." : ".")); return;
                  }
                  toast(register ? "Creating account…" : "Signing in…");
                  new Thread(() -> {
                      try {
                          JSONObject payload = new JSONObject(); payload.put("email", mail); payload.put("password", password);
                          String path;
                          if (register) {
                              path = "/auth/v1/signup";
                              JSONObject data = new JSONObject(); data.put("role", chosenRole); data.put("display_name", name);
                              payload.put("data", data);
                          } else path = "/auth/v1/token?grant_type=password";
                          String response = httpRequest(path, "POST", payload, false, "return=representation");
                          JSONObject result = response.isEmpty() ? new JSONObject() : new JSONObject(response);
                          String token = result.optString("access_token", "");
                          
                          JSONObject user = result.optJSONObject("user");
                          if (user == null && result.has("id")) user = result;
                          if (token.isEmpty() || user == null) {
                              runOnUiThread(() -> new AlertDialog.Builder(this).setTitle("Account created")
                                  .setMessage("Supabase may require email confirmation. Confirm your email, then return here and tap Login.")
                                  .setPositiveButton("OK", (di, w) -> { screen = "login"; render(); }).show());
                              return;
                          }
                          String id = user.optString("id", "");
                          JSONObject metadata = user.optJSONObject("user_metadata");
                          String metadataRole = metadata == null ? "" : metadata.optString("role", "");
                          String metadataName = metadata == null ? "" : metadata.optString("display_name", name);
                          if (!metadataRole.isEmpty() && !metadataRole.equals(chosenRole)) {
                              throw new Exception("This account is registered as " + metadataRole + ". Choose the matching login type.");
                          }
                          if (id.isEmpty()) throw new Exception("Authentication response did not include a user ID.");
                          long expiry = System.currentTimeMillis() / 1000L + result.optLong("expires_in", 3600);
                          accessToken = token; refreshToken = result.optString("refresh_token", ""); tokenExpiresAt = expiry;
                          userId = id; currentRole = metadataRole.isEmpty() ? chosenRole : metadataRole; email = mail;
                          if (metadataName != null && !metadataName.isEmpty()) displayName = metadataName;
                          else if (!name.isEmpty()) displayName = name;
                          pref.edit().putString("access_token", accessToken).putString("refresh_token", refreshToken)
                              .putLong("token_expires_at", tokenExpiresAt).putString("user_id", userId)
                              .putString("role", currentRole).putString("email", email).putString("display_name", displayName).apply();
                          ensureProfile(register);
                          runOnUiThread(() -> {
                              screen = "app"; tab = 0; render();
                              if ("recycler".equals(currentRole) && !recyclerAuthorized) {
                                  new AlertDialog.Builder(this).setTitle("Verification pending")
                                      .setMessage("Your recycler account is created, but authorisation is pending. Nearby lots and order placement unlock after verification.")
                                      .setPositiveButton("OK", null).show();
                              } else toast("Welcome to Kabadi Saathi");
                          });
                      } catch (Exception e) {
                          String msg = e.getMessage() == null ? "Authentication failed. Check internet and Supabase settings." : e.getMessage();
                          runOnUiThread(() -> new AlertDialog.Builder(this).setTitle("Login / registration failed").setMessage(msg).setPositiveButton("OK", null).show());
                      }
                  }).start();
              }
          
              private synchronized void refreshIfNeeded() throws Exception {
                  long now = System.currentTimeMillis() / 1000L;
                  if (refreshToken.isEmpty() || tokenExpiresAt == 0 || now < tokenExpiresAt - 60) return;
                  JSONObject body = new JSONObject(); body.put("refresh_token", refreshToken);
                  String response = httpRequest("/auth/v1/token?grant_type=refresh_token", "POST", body, false, "return=representation");
                  JSONObject result = new JSONObject(response);
                  if (!result.optString("access_token", "").isEmpty()) {
                      accessToken = result.getString("access_token");
                      refreshToken = result.optString("refresh_token", refreshToken);
                      tokenExpiresAt = now + result.optLong("expires_in", 3600);
                      pref.edit().putString("access_token", accessToken).putString("refresh_token", refreshToken).putLong("token_expires_at", tokenExpiresAt).apply();
                  }
              }
          
              private void ensureProfile(boolean register) throws Exception {
                  String raw = httpRequest("/rest/v1/user_profiles?select=id,role,display_name,is_authorized&id=eq." + userId, "GET", null, true, null);
                  JSONArray rows = new JSONArray(raw);
                  if (rows.length() > 0) {
                      JSONObject profile = rows.getJSONObject(0);
                      String storedRole = profile.optString("role", currentRole);
                      if (!storedRole.equals(currentRole)) throw new Exception("Account role does not match this login screen.");
                      displayName = profile.optString("display_name", displayName);
                      recyclerAuthorized = profile.optBoolean("is_authorized", false);
                  } else {
                      JSONObject profile = new JSONObject(); profile.put("id", userId); profile.put("role", currentRole);
                      profile.put("display_name", displayName); profile.put("is_authorized", "collector".equals(currentRole));
                      httpRequest("/rest/v1/user_profiles", "POST", profile, true, "return=minimal");
                      recyclerAuthorized = "collector".equals(currentRole);
                  }
                  pref.edit().putString("display_name", displayName).putBoolean("recycler_authorized", recyclerAuthorized).apply();
              }
          
              private String httpRequest(String path, String method, JSONObject payload, boolean auth, String prefer) throws Exception {
                  if (auth) refreshIfNeeded();
                  HttpURLConnection connection = null;
                  try {
                      URL url = new URL(SUPABASE_URL + path);
                      connection = (HttpURLConnection) url.openConnection();
                      connection.setRequestMethod(method); connection.setConnectTimeout(20000); connection.setReadTimeout(20000);
                      connection.setRequestProperty("apikey", SUPABASE_KEY);
                      connection.setRequestProperty("Accept", "application/json");
                      if (auth && !accessToken.isEmpty()) connection.setRequestProperty("Authorization", "Bearer " + accessToken);
                      if (payload != null) {
                          connection.setDoOutput(true); connection.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                          if (prefer != null) connection.setRequestProperty("Prefer", prefer);
                          byte[] bytes = payload.toString().getBytes(StandardCharsets.UTF_8);
                          try (OutputStream out = connection.getOutputStream()) { out.write(bytes); }
                      } else if (prefer != null) connection.setRequestProperty("Prefer", prefer);
                      int code = connection.getResponseCode();
                      InputStream stream = (code >= 200 && code < 300) ? connection.getInputStream() : connection.getErrorStream();
                      ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                      if (stream != null) { byte[] bytes = new byte[4096]; int n; while ((n = stream.read(bytes)) != -1) buffer.write(bytes, 0, n); stream.close(); }
                      String response = buffer.toString("UTF-8");
                      if (code < 200 || code >= 300) throw new Exception("Supabase HTTP " + code + ": " + response);
                      return response;
                  } finally { if (connection != null) connection.disconnect(); }
              }
          

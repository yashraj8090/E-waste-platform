              JSONArray sortNearby(JSONArray input) {
                  java.util.ArrayList<JSONObject> list = new java.util.ArrayList<>();
                  for (int i=0;i<input.length();i++) { JSONObject item=input.optJSONObject(i); if(item!=null) list.add(item); }
                  if (currentLat != 0 || currentLon != 0) {
                      java.util.Collections.sort(list, (a,b) -> Double.compare(distanceForSort(a), distanceForSort(b)));
                  }
                  JSONArray out = new JSONArray(); for (JSONObject item : list) out.put(item); return out;
              }
              double distanceForSort(JSONObject item) {
                  if (!item.has("latitude") || item.isNull("latitude") || !item.has("longitude") || item.isNull("longitude")) return Double.MAX_VALUE;
                  return distanceKm(currentLat,currentLon,item.optDouble("latitude"),item.optDouble("longitude"));
              }
              double distanceKm(double lat1,double lon1,double lat2,double lon2) {
                  double r=6371;double dLat=Math.toRadians(lat2-lat1),dLon=Math.toRadians(lon2-lon1);
                  double a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(Math.toRadians(lat1))*Math.cos(Math.toRadians(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
                  return r*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
              }
              String shortId(String id) { if(id==null||id.isEmpty())return "—";return id.length()>12?id.substring(0,8)+"…":id; }
              String money(double value) { return String.format(Locale.US,"%.2f",value); }
              String isoNow() { SimpleDateFormat f=new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'",Locale.US); f.setTimeZone(java.util.TimeZone.getTimeZone("UTC")); return f.format(new Date()); }
          

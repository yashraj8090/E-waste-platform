              void uploadLotToSupabase(JSONObject item) {
                  new Thread(() -> { try {
                      JSONObject record = new JSONObject();
                      String photoUri = item.optString("photo_uri", "");
                      if (!photoUri.isEmpty()) {
                          try {
                              String photoUrl = uploadLotPhoto(Uri.parse(photoUri), item.optString("id"));
                              if (!photoUrl.isEmpty()) {
                                  record.put("photo_url", photoUrl); item.put("photo_url", photoUrl);
                                  JSONArray saved = localLots();
                                  for (int i=0;i<saved.length();i++) { JSONObject savedItem=saved.optJSONObject(i); if(savedItem!=null && savedItem.optString("id").equals(item.optString("id"))) { saved.put(i,item); break; } }
                                  pref.edit().putString("lots", saved.toString()).apply();
                              }
                          } catch (Exception photoError) {
                              android.util.Log.e("LOT_PHOTO_UPLOAD", "Photo upload failed", photoError);
                          }
                      }
                      String[] keys = {"id","collector_id","collector_name","material","weight","price_per_kg","location","status","latitude","longitude","created_at","photo_url"};
                      for (String key : keys) if (item.has(key)) record.put(key, item.get(key));
                      httpRequest("/rest/v1/scrap_lots", "POST", record, true, "return=minimal");
                      runOnUiThread(() -> toast("Lot uploaded to the shared marketplace."));
                  } catch (Exception e) { runOnUiThread(() -> new AlertDialog.Builder(this).setTitle("Lot saved locally; sync failed").setMessage(e.getMessage()).setPositiveButton("OK",null).show()); } }).start();
              }
          
              String uploadLotPhoto(Uri photoUri, String lotId) throws Exception {
                  BitmapFactory.Options bounds = new BitmapFactory.Options(); bounds.inJustDecodeBounds = true;
                  try (InputStream in = getContentResolver().openInputStream(photoUri)) { BitmapFactory.decodeStream(in, null, bounds); }
                  if (bounds.outWidth <= 0 || bounds.outHeight <= 0) throw new Exception("Selected photo is not a supported image");
                  BitmapFactory.Options opts = new BitmapFactory.Options(); opts.inSampleSize = 1;
                  while (bounds.outWidth / opts.inSampleSize > 1600 || bounds.outHeight / opts.inSampleSize > 1600) opts.inSampleSize *= 2;
                  Bitmap bitmap;
                  try (InputStream in = getContentResolver().openInputStream(photoUri)) { bitmap = BitmapFactory.decodeStream(in, null, opts); }
                  if (bitmap == null) throw new Exception("Cannot decode selected photo");
                  ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                  boolean compressed = bitmap.compress(Bitmap.CompressFormat.JPEG, 82, buffer); bitmap.recycle();
                  if (!compressed) throw new Exception("Cannot prepare selected photo");
                  byte[] bytes = buffer.toByteArray();
                  String objectPath = userId + "/" + lotId + ".jpg";
                  HttpURLConnection connection = null;
                  try {
                      URL url = new URL(SUPABASE_URL + "/storage/v1/object/lot-photos/" + objectPath);
                      connection = (HttpURLConnection) url.openConnection(); connection.setRequestMethod("POST");
                      connection.setConnectTimeout(20000); connection.setReadTimeout(20000); connection.setDoOutput(true);
                      connection.setRequestProperty("apikey", SUPABASE_KEY); connection.setRequestProperty("Authorization", "Bearer " + accessToken);
                      connection.setRequestProperty("Content-Type", "image/jpeg"); connection.setRequestProperty("x-upsert", "true");
                      try (OutputStream out = connection.getOutputStream()) { out.write(bytes); }
                      int code = connection.getResponseCode();
                      if (code < 200 || code >= 300) {
                          InputStream err = connection.getErrorStream(); ByteArrayOutputStream eb = new ByteArrayOutputStream();
                          if (err != null) { byte[] chunk = new byte[1024]; int n; while ((n=err.read(chunk))!=-1) eb.write(chunk,0,n); err.close(); }
                          throw new Exception("Storage HTTP " + code + ": " + eb.toString("UTF-8"));
                      }
                  } finally { if (connection != null) connection.disconnect(); }
                  return SUPABASE_URL + "/storage/v1/object/public/lot-photos/" + objectPath;
              }
          

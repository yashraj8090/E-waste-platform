
name: Build Kabadi Saathi APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KabadiSaathi"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          mkdir -p app/src/main/java/com/ecocycle/app
          mkdir -p app/src/main/res/values

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ecocycle.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ecocycle.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Kabadi Saathi"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2FEB59</item>
                  <item name="android:statusBarColor">#073D32</item>
                  <item name="android:navigationBarColor">#073D32</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/ecocycle/app/MainActivity.java <<'EOF'
          package com.ecocycle.app;

          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              SharedPreferences pref;
              LinearLayout root, body;
              boolean night;
              int tab = 0, bg, fg, muted, card;
              int green = Color.rgb(7, 61, 50);
              int lime = Color.rgb(47, 235, 89);

              String[] names = {
                  "CRT / सीआरटी", "PCB / पीसीबी",
                  "केबल / Cables", "बैटरी / Battery",
                  "मोटर / Motor", "प्लास्टिक / Plastic"
              };
              String[] rates = {"18", "120", "60", "40", "50", "15"};
              String[] icons = {"▣", "▦", "⌁", "▯", "⚙", "♧"};
              String[] tabs = {
                  "⌂\nहोम\nHome", "₹\nदर\nRates",
                  "▣\nमेरे लॉट्स\nMy Lots", "●\nप्रोफ़ाइल\nProfile"
              };

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  pref = getSharedPreferences("ecocycle", MODE_PRIVATE);
                  night = pref.getBoolean("night_mode", true);
                  render();
              }

              int d(int x) {
                  return (int)(x * getResources().getDisplayMetrics().density + 0.5f);
              }

              GradientDrawable shape(int color, int stroke, int radius) {
                  GradientDrawable x = new GradientDrawable();
                  x.setColor(color);
                  x.setCornerRadius(d(radius));
                  if (stroke != 0) x.setStroke(d(1), stroke);
                  return x;
              }

              TextView t(String s, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(null, Typeface.BOLD);
                  v.setGravity(Gravity.CENTER_VERTICAL);
                  return v;
              }

              LinearLayout col() {
                  LinearLayout x = new LinearLayout(this);
                  x.setOrientation(LinearLayout.VERTICAL);
                  return x;
              }

              LinearLayout row() {
                  LinearLayout x = new LinearLayout(this);
                  x.setOrientation(LinearLayout.HORIZONTAL);
                  x.setGravity(Gravity.CENTER_VERTICAL);
                  return x;
              }

              LinearLayout.LayoutParams lp(int w, int h) {
                  return new LinearLayout.LayoutParams(
                      w < 0 ? w : d(w), h < 0 ? h : d(h)
                  );
              }

              void pad(View v, int p) {
                  v.setPadding(d(p), d(p), d(p), d(p));
              }

              LinearLayout panel() {
                  LinearLayout x = col();
                  x.setBackground(shape(
                      card, night ? lime : Color.rgb(225, 232, 225), 16
                  ));
                  pad(x, 14);
                  return x;
              }

              void heading(String s) {
                  TextView x = t(s, 19, night ? Color.WHITE : green, true);
                  LinearLayout.LayoutParams p = lp(-1, -2);
                  p.setMargins(0, d(14), 0, d(9));
                  body.addView(x, p);
              }

              void render() {
                  bg = night ? Color.rgb(3, 39, 32)
                             : Color.rgb(246, 247, 242);
                  card = Color.WHITE;
                  fg = green;
                  muted = night ? Color.rgb(70, 95, 84)
                                : Color.rgb(91, 111, 101);

                  root = col();
                  root.setBackgroundColor(bg);
                  setContentView(root);

                  LinearLayout h = row();
                  h.setBackground(shape(green, 0, 16));
                  pad(h, 12);

                  TextView leaf = t("❧", 34, lime, true);
                  h.addView(leaf, lp(45, 50));

                  LinearLayout brand = col();
                  brand.addView(t("कबाड़ी साथी", 22, Color.WHITE, true));
                  brand.addView(t("Kabadi Saathi", 20, Color.WHITE, true));
                  h.addView(brand, new LinearLayout.LayoutParams(0, -2, 1));

                  TextView mode = t(night ? "☼" : "☾", 25, lime, true);
                  mode.setGravity(Gravity.CENTER);
                  mode.setOnClickListener(v -> {
                      night = !night;
                      pref.edit().putBoolean("night_mode", night).apply();
                      render();
                  });
                  h.addView(mode, lp(40, 45));

                  LinearLayout.LayoutParams hp = lp(-1, -2);
                  hp.setMargins(d(14), d(12), d(14), d(7));
                  root.addView(h, hp);

                  ScrollView sc = new ScrollView(this);
                  body = col();
                  body.setPadding(d(14), d(3), d(14), d(14));
                  sc.addView(body);
                  root.addView(sc, new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout n = row();
                  n.setBackground(shape(
                      night ? Color.rgb(5, 57, 45) : Color.WHITE, 0, 18
                  ));

                  for (int i = 0; i < 4; i++) {
                      final int k = i;
                      int navColor = tab == i ? lime :
                          (night ? Color.LTGRAY : Color.DKGRAY);
                      TextView b = t(tabs[i], 11, navColor, tab == i);
                      b.setGravity(Gravity.CENTER);
                      b.setLineSpacing(0, 0.9f);
                      b.setPadding(d(1), d(7), d(1), d(7));
                      b.setOnClickListener(v -> {
                          tab = k;
                          render();
                      });
                      n.addView(b, new LinearLayout.LayoutParams(0, d(62), 1));
                  }

                  LinearLayout.LayoutParams np = lp(-1, -2);
                  np.setMargins(d(9), d(3), d(9), d(8));
                  root.addView(n, np);

                  if (tab == 0) home();
                  else if (tab == 1) ratesPage();
                  else if (tab == 2) lotsPage();
                  else profile();
              }

              Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setTypeface(null, Typeface.BOLD);
                  b.setTextColor(green);
                  b.setBackground(shape(lime, 0, 13));
                  return b;
              }

              void gap(int h) {
                  body.addView(new View(this), lp(1, h));
              }

              void home() {
                  TextView greet = t(
                      "नमस्कार! / Namaskar!", 19,
                      night ? Color.WHITE : green, true
                  );
                  greet.setGravity(Gravity.CENTER);
                  body.addView(greet, lp(-1, 32));

                  TextView sub = t(
                      "ई-कचरा बिक्री • सुरक्षित • आसान\nE-Waste Sell • Safe • Easy",
                      13, night ? Color.rgb(207,224,215) : muted, false
                  );
                  sub.setGravity(Gravity.CENTER);
                  body.addView(sub, lp(-1, 42));
                  gap(7);

                  LinearLayout e = panel();
                  e.addView(t("कमाई नोंद / Earnings Ledger", 17, fg, true));
                  e.addView(t("एकूण कमाई / Total Earnings", 14, fg, true));
                  e.addView(t("₹" + pref.getInt("earnings", 1240), 30, fg, true));
                  e.addView(t("+₹120 आज / +₹120 Today (Demo)", 12, green, true));
                  body.addView(e, lp(-1, -2));

                  heading("साहित्य दर / Buying Rates (₹ / kg)");

                  for (int r = 0; r < 2; r++) {
                      LinearLayout rr = row();
                      for (int c = 0; c < 3; c++) {
                          int i = r * 3 + c;
                          LinearLayout tile = col();
                          tile.setGravity(Gravity.CENTER);
                          tile.setBackground(shape(
                              card, night ? lime : Color.rgb(225,232,225), 13
                          ));
                          pad(tile, 5);

                          TextView ic = t(icons[i], 25, green, true);
                          ic.setGravity(Gravity.CENTER);
                          tile.addView(ic, lp(-1, 32));

                          TextView nm = t(names[i], 11, green, true);
                          nm.setGravity(Gravity.CENTER);
                          tile.addView(nm, lp(-1, 32));

                          TextView price = t("₹" + rates[i], 16, green, true);
                          price.setGravity(Gravity.CENTER);
                          tile.addView(price);

                          LinearLayout.LayoutParams p =
                              new LinearLayout.LayoutParams(0, d(105), 1);
                          p.setMargins(d(3), d(3), d(3), d(3));
                          rr.addView(tile, p);
                      }
                      body.addView(rr);
                  }

                  body.addView(t(
                      "नमूना दरें / Demo rates only; prices may vary.",
                      11, night ? Color.rgb(207,224,215) : muted, false
                  ), lp(-1, 27));

                  Button photo = button("▣  फोटो चुनें / Add Photo");
                  photo.setOnClickListener(v -> choosePhoto());
                  body.addView(photo, lp(-1, 52));

                  Button add = button("＋ नया स्क्रैप लॉट / Add Scrap Lot");
                  add.setOnClickListener(v -> addLot());
                  LinearLayout.LayoutParams p = lp(-1, 50);
                  p.setMargins(0, d(7), 0, 0);
                  body.addView(add, p);
              }

              void choosePhoto() {
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.setType("image/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  try {
                      startActivityForResult(
                          Intent.createChooser(i, "फोटो चुनें / Choose photo"), 72
                      );
                  } catch (Exception e) {
                      Toast.makeText(this, "Photo picker unavailable",
                          Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onActivityResult(int r, int c, Intent data) {
                  super.onActivityResult(r, c, data);
                  if (r == 72 && c == RESULT_OK && data != null
                      && data.getData() != null) {
                      Uri uri = data.getData();
                      pref.edit().putString("photo", uri.toString()).apply();
                      Toast.makeText(this,
                          "फोटो चुनी गई / Photo selected",
                          Toast.LENGTH_SHORT).show();
                  }
              }

              void addLot() {
                  LinearLayout form = col();
                  pad(form, 12);

                  EditText m = new EditText(this);
                  m.setHint("सामग्री / Material (e.g. PCB)");
                  form.addView(m, lp(-1, 50));

                  EditText w = new EditText(this);
                  w.setHint("वजन किलो में / Weight in kg");
                  w.setInputType(8194);
                  form.addView(w, lp(-1, 50));

                  EditText loc = new EditText(this);
                  loc.setHint("स्थान वैकल्पिक / Location (optional)");
                  form.addView(loc, lp(-1, 50));

                  new AlertDialog.Builder(this)
                      .setTitle("नया लॉट / New Scrap Lot")
                      .setView(form)
                      .setNegativeButton("रद्द / Cancel", null)
                      .setPositiveButton("सेव / Save", (a, b) -> {
                          try {
                              String material = m.getText().toString().trim();
                              String weight = w.getText().toString().trim();
                              double kg = Double.parseDouble(weight);

                              if (material.isEmpty() || kg <= 0) {
                                  throw new Exception();
                              }

                              JSONArray ar = new JSONArray(
                                  pref.getString("lots", "[]")
                              );
                              JSONObject o = new JSONObject();
                              o.put("id", "KS-" + (System.currentTimeMillis() % 1000000));
                              o.put("material", material);
                              o.put("weight", kg);
                              o.put("location", loc.getText().toString().trim());
                              ar.put(o);

                              pref.edit().putString("lots", ar.toString()).apply();
                              tab = 2;
                              render();
                              Toast.makeText(this,
                                  "लॉट सेव हुआ / Lot saved",
                                  Toast.LENGTH_SHORT).show();
                          } catch (Exception ex) {
                              Toast.makeText(this,
                                  "Enter material and a valid positive weight",
                                  Toast.LENGTH_SHORT).show();
                          }
                      }).show();
              }

              void ratesPage() {
                  heading("साहित्य दर / Buying Rates");
                  body.addView(t(
                      "नमूना दरें / Demo prices — not live market data",
                      12, night ? Color.rgb(207,224,215) : muted, false
                  ), lp(-1, 30));

                  for (int i = 0; i < 6; i++) {
                      LinearLayout p = panel();
                      LinearLayout r = row();
                      r.addView(t(icons[i], 26, green, true), lp(44, 42));

                      LinearLayout details = col();
                      details.addView(t(names[i], 16, fg, true));
                      details.addView(t("₹" + rates[i] + " / kg", 19, fg, true));
                      r.addView(details, new LinearLayout.LayoutParams(0, -2, 1));
                      p.addView(r);

                      LinearLayout.LayoutParams q = lp(-1, -2);
                      q.setMargins(0, 0, 0, d(9));
                      body.addView(p, q);
                  }
              }

              void lotsPage() {
                  heading("मेरे लॉट्स / My Scrap Lots");
                  Button b = button("＋ नया लॉट / Add Lot");
                  b.setOnClickListener(v -> addLot());
                  body.addView(b, lp(-1, 48));

                  JSONArray ar;
                  try {
                      ar = new JSONArray(pref.getString("lots", "[]"));
                  } catch (Exception e) {
                      ar = new JSONArray();
                  }

                  if (ar.length() == 0) {
                      TextView empty = t(
                          "अभी कोई लॉट नहीं / No lots yet.\nAdd a scrap lot to see it here.",
                          15, night ? Color.rgb(207,224,215) : muted, false
                      );
                      empty.setGravity(Gravity.CENTER);
                      body.addView(empty, lp(-1, 100));
                  }

                  for (int i = ar.length() - 1; i >= 0; i--) {
                      JSONObject o = ar.optJSONObject(i);
                      if (o == null) continue;

                      LinearLayout p = panel();
                      p.addView(t(o.optString("material"), 17, fg, true));
                      p.addView(t("ID: " + o.optString("id"), 12, fg, false));
                      p.addView(t(
                          "वजन / Weight: " + o.optDouble("weight") + " kg",
                          14, fg, true
                      ));

                      if (!o.optString("location").isEmpty()) {
                          p.addView(t(
                              "स्थान / Location: " + o.optString("location"),
                              13, fg, false
                          ));
                      }

                      p.addView(t(
                          "स्थिति / Status: Pending / प्रलंबित",
                          13, fg, true
                      ));

                      LinearLayout.LayoutParams q = lp(-1, -2);
                      q.setMargins(0, d(10), 0, 0);
                      body.addView(p, q);
                  }
              }

              void profile() {
                  heading("प्रोफ़ाइल / Profile");
                  LinearLayout p = panel();
                  p.addView(t("कबाड़ी साथी / Kabadi Saathi", 20, fg, true));
                  p.addView(t("ई-कचरा बिक्री • सुरक्षित • आसान", 14, fg, false));
                  p.addView(t("E-Waste Sell • Safe • Easy", 14, fg, false));
                  body.addView(p, lp(-1, -2));

                  heading("सेटिंग्स / Settings");
                  Button mode = button(
                      night ? "☼ दिन मोड / Day Mode" : "☾ रात मोड / Night Mode"
                  );
                  mode.setOnClickListener(v -> {
                      night = !night;
                      pref.edit().putBoolean("night_mode", night).apply();
                      render();
                  });
                  body.addView(mode, lp(-1, 50));

                  heading("सुरक्षा सुझाव / Safety Tips");
                  body.addView(t(
                      "• बैटरी को न काटें या जलाएँ।\n" +
                      "• ई-कचरा अलग-अलग रखें।\n" +
                      "• दस्ताने पहनें और हाथ धोएँ।\n\n" +
                      "• Do not cut or burn batteries.\n" +
                      "• Separate e-waste by material.\n" +
                      "• Wear gloves and wash hands.",
                      14, night ? Color.rgb(207,224,215) : muted, false
                  ), lp(-1, -2));

                  gap(12);
                  body.addView(t(
                      "कमाई और दरें डेमो हैं। लाइव भुगतान, लाइव बाजार दरें " +
                      "या recycler verification उपलब्ध नहीं हैं.\n" +
                      "Earnings and prices are demos. No live payments, " +
                      "market rates, or recycler verification.",
                      12, night ? Color.rgb(207,224,215) : muted, false
                  ), lp(-1, -2));
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EcoCycle-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

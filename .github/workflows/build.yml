              void fetchMyLots() {
                  new Thread(() -> { try {
                      String raw = httpRequest("/rest/v1/scrap_lots?select=id,collector_id,collector_name,material,weight,price_per_kg,location,status,latitude,longitude,created_at,photo_url&collector_id=eq." + userId + "&order=created_at.desc", "GET", null, true, null);
                      JSONArray remote = new JSONArray(raw); JSONArray merged = new JSONArray(); java.util.HashSet<String> seen = new java.util.HashSet<>();
                      for (int i=0;i<remote.length();i++) { JSONObject o=remote.optJSONObject(i); if(o!=null){merged.put(o);seen.add(o.optString("id"));} }
                      JSONArray local = localLots(); for(int i=0;i<local.length();i++){JSONObject o=local.optJSONObject(i);if(o!=null && !seen.contains(o.optString("id"))) merged.put(o);}
                      pref.edit().putString("lots",merged.toString()).apply(); runOnUiThread(() -> { if(tab==1) render(); toast("Loaded " + remote.length() + " lots."); });
                  } catch(Exception e) { runOnUiThread(() -> toast("Could not load lots: " + e.getMessage())); } }).start();
              }
              

              interface LocationCallback { void onLocation(Location location); }
              LocationCallback pendingLocationCallback;
              void requestCurrentLocation() { requestCurrentLocation(null); }
              void requestCurrentLocation(LocationCallback callback) {
                  pendingLocationCallback=callback;
                  if(checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED && checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)!=PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION},LOCATION_PERMISSION_REQUEST);return;
                  }
                  try {
                      Location best=null;
                      if(locationManager!=null) {
                          if(locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) best=locationManager.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                          if(locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) { Location n=locationManager.getLastKnownLocation(LocationManager.NETWORK_PROVIDER); if(n!=null&&(best==null||n.getTime()>best.getTime()))best=n; }
                      }
                      if(best!=null) { acceptLocation(best); return; }
                      if(locationManager==null) throw new Exception("Location service unavailable.");
                      LocationListener listener=new LocationListener(){@Override public void onLocationChanged(Location loc){try{locationManager.removeUpdates(this);}catch(Exception ignored){} acceptLocation(loc);}
                          @Override public void onProviderEnabled(String p){} @Override public void onProviderDisabled(String p){} @Override public void onStatusChanged(String p,int s,android.os.Bundle b){} };
                      boolean requested=false;
                      if(locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)){locationManager.requestLocationUpdates(LocationManager.NETWORK_PROVIDER,0,0,listener);requested=true;}
                      if(locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)){locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER,0,0,listener);requested=true;}
                      if(!requested) throw new Exception("GPS is disabled. Enable Location in phone settings.");
                      toast("Waiting for current GPS location…");
                  }catch(SecurityException e){toast("Please allow location permission.");}catch(Exception e){toast(e.getMessage()==null?"Could not read GPS location.":e.getMessage());}
              }
          
              @Override public void onRequestPermissionsResult(int requestCode,String[] permissions,int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode,permissions,grantResults);
                  if(requestCode==LOCATION_PERMISSION_REQUEST){boolean ok=false;for(int result:grantResults)if(result==PackageManager.PERMISSION_GRANTED)ok=true;
                      if(ok)requestCurrentLocation(pendingLocationCallback);else toast("Location permission was not granted.");}
              }
          
              void acceptLocation(Location loc) {
                  currentLat=loc.getLatitude();currentLon=loc.getLongitude();
                  pref.edit().putLong("current_lat",Double.doubleToLongBits(currentLat)).putLong("current_lon",Double.doubleToLongBits(currentLon)).apply();
                  runOnUiThread(()->{toast("Current location saved.");if(pendingLocationCallback!=null){LocationCallback cb=pendingLocationCallback;pendingLocationCallback=null;cb.onLocation(loc);}else if("app".equals(screen)&&"recycler".equals(currentRole)&&tab==1)render();});
              }
          
